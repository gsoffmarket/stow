name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.7
        env:
          POSTGRES_USER: stow
          POSTGRES_PASSWORD: stow
          POSTGRES_DB: stow
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U stow"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://stow:stow@localhost:54329/stow
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
