# Local Postgres for development and integration tests. Not used in production.
services:
  postgres:
    image: postgres:18.7
    environment:
      POSTGRES_USER: stow
      POSTGRES_PASSWORD: stow
      POSTGRES_DB: stow
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql
volumes:
  pgdata:
